sonar.projectKey=good-meet-fe
sonar.projectName=good-meet-fe
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src,tests
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,tests/**/*.ts,tests/**/*.tsx

sonar.typescript.tsconfigPaths=tsconfig.app.json,tsconfig.node.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/**/*.d.ts,src/main.tsx,src/setupTests.ts

sonar.scm.provider=git
